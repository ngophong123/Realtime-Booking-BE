<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Realtime Seat Booking Monitor</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 30px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { color: #00e676; margin-top: 0; }
    input {
      width: 68%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
    }
    button {
      padding: 10px 16px;
      background: #00e676;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #00c853; }
    #logs {
      margin-top: 20px;
      height: 320px;
      background: #0a0a0a;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      font-family: monospace;
      border: 1px solid #333;
    }
    .log-item {
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      animation: fadeIn 0.3s ease-in-out;
    }
    .held { background: #ffd600; color: #000; font-weight: bold; }
    .released { background: #757575; color: #fff; }
    .booked { background: #ff1744; color: #fff; font-weight: bold; }
    .info { background: #2979ff; color: #fff; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ Giám Sát Suất Chiếu Thời Gian Thực (Socket.io)</h2>
    <p>Trạng thái kết nối: <span id="status" style="color: red; font-weight: bold;">Chưa kết nối</span></p>

    <div>
      <input type="text" id="showtimeId" placeholder="Dán ID Suất Chiếu vào đây...">
      <button onclick="joinShowtime()">Tham Gia Phòng</button>
    </div>

    <h3>📡 Nhật ký sự kiện thời gian thực (Live Events):</h3>
    <div id="logs">
      <div class="log-item info">👉 Hãy nhập ID suất chiếu và bấm "Tham Gia Phòng" để lắng nghe sự kiện...</div>
    </div>
  </div>

  <script>
    const socket = io('http://localhost:8000');
    const statusEl = document.getElementById('status');
    const logsEl = document.getElementById('logs');
    let currentShowtimeId = null;

    socket.on('connect', () => {
      statusEl.innerText = 'Đã kết nối (' + socket.id + ')';
      statusEl.style.color = '#00e676';
      addLog('🔌 Đã kết nối thành công tới Server WebSocket!', 'info');
    });

    socket.on('disconnect', () => {
      statusEl.innerText = 'Mất kết nối';
      statusEl.style.color = '#ff1744';
      addLog('❌ Mất kết nối tới Server!', 'info');
    });

    socket.on('seat:held', (data) => {
      addLog(`🟡 [REALTIME] Ghế vừa bị giữ chỗ: ${JSON.stringify(data.seatIds)}`, 'held');
    });

    socket.on('seat:released', (data) => {
      addLog(`⚪ [REALTIME] Ghế vừa được giải phóng: ${JSON.stringify(data.seatIds)}`, 'released');
    });

    socket.on('seat:booked', (data) => {
      addLog(`🔴 [REALTIME] Ghế đã bán thành công: ${JSON.stringify(data.seatIds)} (Mã HD: ${data.bookingId})`, 'booked');
    });

    function joinShowtime() {
      const showtimeId = document.getElementById('showtimeId').value.trim();
      if (!showtimeId) {
        alert('Vui lòng nhập ID Suất chiếu!');
        return;
      }
      currentShowtimeId = showtimeId;
      socket.emit('join:showtime', showtimeId);
      addLog(`🚪 Đã tham gia vào phòng của Suất chiếu: ${showtimeId}`, 'info');
    }

    function addLog(message, className) {
      const div = document.createElement('div');
      div.className = `log-item ${className}`;
      div.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsEl.prepend(div);
    }
  </script>
</body>
</html>
